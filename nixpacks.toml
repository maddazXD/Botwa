# nixpacks.toml — konfigurasi build eksplisit buat Railway.
#
# MASALAH: tanpa file ini, Railway pakai auto-detect Nixpacks default yang
# cuma nyiapin Node.js doang — TIDAK termasuk ffmpeg. Akibatnya semua
# fitur yang manggil binary ffmpeg lewat child_process.exec() (reencode
# video TikTok/Instagram, convert audio YouTube, dll) gagal dengan error
# "/bin/sh: 1: ffmpeg: not found".
#
# FIX: tambahin ffmpeg ke nixPkgs, jadi ke-install di build image sebelum
# `npm start` dijalankan.
[phases.setup]
nixPkgs = ["nodejs", "ffmpeg"]

# FIX: @itsliaaa/baileys mendeklarasikan jimp@^1.6.1 sebagai peerOptional,
# padahal seluruh kodebase (lib/myfunction.js, lib/tableImage.js,
# plugins/converter/hd.js, plugins/tools/resize.js) pakai API jimp v0.22.x
# (require CommonJS, getBufferAsync, Jimp.MIME_JPEG, loadFont, dst) yang
# TIDAK kompatibel dengan jimp v1. Jangan upgrade jimp — cukup suruh npm
# abaikan peer conflict itu lewat --legacy-peer-deps, dipasang eksplisit
# di sini biar gak gantung ke .npmrc yang mungkin belum ke-copy saat
# phase install jalan.
[phases.install]
cmds = ["npm install --omit=dev --legacy-peer-deps"]

[start]
cmd = "node index.js"
